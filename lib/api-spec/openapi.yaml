openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: NEXORA career marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Account registration and session
  - name: jobs
    description: Job discovery and recruiter listings
  - name: companies
    description: Company profiles
  - name: applications
    description: Applications and review workflows
  - name: dashboard
    description: Account-specific dashboard summaries
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health:
    get:
      operationId: appHealth
      tags: [health]
      summary: Check API and MongoDB availability
      responses:
        "200":
          description: API status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register an applicant or recruiter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the signed-in user's profile
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateMe
      tags: [auth]
      summary: Update the signed-in user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: Search and filter open jobs
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: location
          in: query
          schema: { type: string }
        - name: jobType
          in: query
          schema: { type: string }
        - name: experienceLevel
          in: query
          schema: { type: string }
        - name: salaryMin
          in: query
          schema: { type: number }
        - name: salaryMax
          in: query
          schema: { type: number }
        - name: sort
          in: query
          schema: { type: string, enum: [newest, salary] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
      responses:
        "200":
          description: Matching jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPage"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a job listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Created listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job listing
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Job listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
    put:
      operationId: updateJob
      tags: [jobs]
      summary: Update a recruiter-owned job
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete a recruiter-owned job
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Deleted listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"
  /jobs/mine:
    get:
      operationId: listMyJobs
      tags: [jobs]
      summary: List the signed-in recruiter's listings
      responses:
        "200":
          description: Recruiter listings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Job" }
  /companies:
    get:
      operationId: listCompanies
      tags: [companies]
      summary: List companies with open roles
      responses:
        "200":
          description: Companies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Company" }
    post:
      operationId: createCompany
      tags: [companies]
      summary: Create the recruiter's company profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyInput"
      responses:
        "201":
          description: Company profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
  /companies/{id}:
    get:
      operationId: getCompany
      tags: [companies]
      summary: Get a company profile
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Company profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
    put:
      operationId: updateCompany
      tags: [companies]
      summary: Update the recruiter's company profile
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyInput"
      responses:
        "200":
          description: Updated company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
  /applications:
    post:
      operationId: applyForJob
      tags: [applications]
      summary: Apply to an open job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
  /applications/me:
    get:
      operationId: listMyApplications
      tags: [applications]
      summary: List the signed-in applicant's applications
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Application" }
  /jobs/{id}/applications:
    get:
      operationId: listJobApplications
      tags: [applications]
      summary: Review applicants for a recruiter's job
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Applicant submissions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Application" }
  /applications/{id}/status:
    patch:
      operationId: updateApplicationStatus
      tags: [applications]
      summary: Update application status
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationStatusInput"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
  /applications/{id}/withdraw:
    patch:
      operationId: withdrawApplication
      tags: [applications]
      summary: Withdraw an application that is still eligible
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Withdrawn application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
  /users/me/saved-jobs:
    get:
      operationId: listSavedJobs
      tags: [jobs]
      summary: List saved jobs
      responses:
        "200":
          description: Saved listings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Job" }
  /users/me/saved-jobs/{jobId}:
    put:
      operationId: saveJob
      tags: [jobs]
      summary: Save a job for later
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Saved job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"
    delete:
      operationId: unsaveJob
      tags: [jobs]
      summary: Remove a saved job
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Removed saved job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get database-backed dashboard metrics for the current account
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /stats:
    get:
      operationId: getPublicStats
      tags: [dashboard]
      summary: Get public marketplace totals for the landing page
      responses:
        "200":
          description: Marketplace totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicStats"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        database:
          type: ["string", "null"]
      required:
        - status
    MessageResult:
      type: object
      properties:
        message: { type: string }
      required: [message]
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [Applicant, Recruiter] }
        skills:
          type: array
          items: { type: string }
        location: { type: ["string", "null"] }
        resumeUrl: { type: ["string", "null"] }
        companyId: { type: ["string", "null"] }
      required: [id, name, email, role, skills]
    RegisterInput:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        role: { type: string, enum: [Applicant, Recruiter] }
      required: [name, email, password, role]
    LoginInput:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
      required: [email, password]
    AuthResult:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
      required: [user]
    ProfileUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        skills:
          type: array
          items: { type: string }
        location: { type: string }
        resumeUrl: { type: string }
    Company:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        website: { type: string }
        location: { type: string }
        logoUrl: { type: ["string", "null"] }
        recruiterId: { type: string }
        openJobs: { type: integer }
      required: [id, name, description, website, location, recruiterId, openJobs]
    CompanyInput:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        description: { type: string, minLength: 12 }
        website: { type: string }
        location: { type: string, minLength: 2 }
        logoUrl: { type: string }
      required: [name, description, website, location]
    Job:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        companyId: { type: string }
        companyName: { type: string }
        recruiterId: { type: string }
        description: { type: string }
        requirements: { type: string }
        skills:
          type: array
          items: { type: string }
        location: { type: string }
        jobType: { type: string }
        experienceLevel: { type: string }
        salaryMin: { type: number }
        salaryMax: { type: number }
        status: { type: string, enum: [Open, Closed] }
        createdAt: { type: string, format: date-time }
        applicationCount: { type: integer }
      required: [id, title, companyId, companyName, recruiterId, description, requirements, skills, location, jobType, experienceLevel, salaryMin, salaryMax, status, createdAt, applicationCount]
    JobInput:
      type: object
      properties:
        title: { type: string, minLength: 3 }
        description: { type: string, minLength: 20 }
        requirements: { type: string, minLength: 5 }
        skills:
          type: array
          items: { type: string }
        location: { type: string, minLength: 2 }
        jobType: { type: string, enum: [Full-time, Part-time, Contract, Internship, Remote] }
        experienceLevel: { type: string, enum: [Entry, Mid, Senior, Lead] }
        salaryMin: { type: number, minimum: 0 }
        salaryMax: { type: number, minimum: 0 }
        status: { type: string, enum: [Open, Closed] }
      required: [title, description, requirements, skills, location, jobType, experienceLevel, salaryMin, salaryMax]
    JobPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Job" }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        pages: { type: integer }
      required: [items, page, limit, total, pages]
    Application:
      type: object
      properties:
        id: { type: string }
        jobId: { type: string }
        jobTitle: { type: string }
        companyName: { type: string }
        applicantId: { type: string }
        applicantName: { type: string }
        applicantEmail: { type: string }
        applicantSkills:
          type: array
          items: { type: string }
        applicantLocation: { type: ["string", "null"] }
        resumeUrl: { type: ["string", "null"] }
        coverLetter: { type: ["string", "null"] }
        status: { type: string, enum: [Submitted, Reviewing, Shortlisted, Interview, Offered, Rejected, Withdrawn] }
        appliedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, jobId, jobTitle, companyName, applicantId, applicantName, applicantEmail, applicantSkills, status, appliedAt, updatedAt]
    ApplicationInput:
      type: object
      properties:
        jobId: { type: string }
        resumeUrl: { type: string }
        coverLetter: { type: string, maxLength: 5000 }
      required: [jobId]
    ApplicationStatusInput:
      type: object
      properties:
        status: { type: string, enum: [Reviewing, Shortlisted, Interview, Offered, Rejected] }
      required: [status]
    DashboardSummary:
      type: object
      properties:
        role: { type: string, enum: [Applicant, Recruiter] }
        openJobs: { type: integer }
        applications: { type: integer }
        shortlisted: { type: integer }
        interviews: { type: integer }
        statusCounts:
          type: object
          additionalProperties: { type: integer }
        recentApplications:
          type: array
          items: { $ref: "#/components/schemas/Application" }
      required: [role, openJobs, applications, shortlisted, interviews, statusCounts, recentApplications]
    PublicStats:
      type: object
      properties:
        openJobs: { type: integer }
        companies: { type: integer }
        applications: { type: integer }
      required: [openJobs, companies, applications]

