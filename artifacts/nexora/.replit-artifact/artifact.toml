kind = "web"
previewPath = "/"
title = "NEXORA — The Next-Gen Job Portal"
description = "A full-stack career platform where applicants discover roles and track applications while recruiters manage listings and candidates, powered by an Express API and MongoDB."
version = "1.0.0"
id = "artifacts/nexora"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23292

[services.development]
run = "pnpm --filter @workspace/nexora run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nexora", "run", "build" ]
serve = "static"
publicDir = "artifacts/nexora/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23292"
BASE_PATH = "/"
